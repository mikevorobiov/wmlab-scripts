[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labtools"
version = "0.1"
dependencies = [
    "numpy < 2", 
    "scipy", 
    "matplotlib"
]        # e.g. the camera SDK, numpy

[tool.setuptools]
# Makes only `labtools` folder install using pip.
# All other folders stay intact and never get installed.
packages = ["labtools"] 